{% extends "base.html" %}
{% block main %}
<article class="post">
  <p class="back"><a href="/blog/">← Writing</a></p>
  <h1>{{ page.title }}</h1>
  <p class="meta"><time datetime="{{ page.date.date() }}">{{ page.date.strftime('%d %B %Y') }}</time> · {{ page.minutes }} min read</p>
  <div class="prose">{{ page.content | safe }}</div>
</article>
{% endblock %}
